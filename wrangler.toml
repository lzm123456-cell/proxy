name = "proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  # { pattern = "your-domain.example.com", custom_domain = true }  # 可选:自定义域名
]

# KV：面板配置存储
[[kv_namespaces]]
binding = "KV"
id = "0e0499754fac49f884936034aa077f40"

[vars]
# UUID 节点认证：部署时生成一次写入（非机密但应稳定）
UUID = "718d99da-302c-4059-b2eb-081ce8a6e82b" # ← 换成你自己的 UUIDv4

[observability]
enabled = true
